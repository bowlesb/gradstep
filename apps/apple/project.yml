name: ScienceReader
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Internal: release
  Release: release
packages:
  ScienceReaderCore:
    path: ScienceReaderCore
  LocalAI:
    path: LocalAI
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3BJ33TT599
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SCIENCE_READER_ENVIRONMENT: staging
configFiles:
  Debug: Config/.env.staging.xcconfig
  Internal: Config/.env.staging.xcconfig
targets:
  ScienceReader:
    type: application
    platform: iOS
    sources:
      - path: ScienceReader
        excludes: [Resources/ReaderSamples, Resources/reader-sample.html, Resources/offline-resource]
      - path: ScienceReader/Resources/ReaderSamples
        type: folder
        buildPhase: resources
      # The on-device PDF route's compiled models (docs/architecture/DEVICE_PDF_ROUTE.md; `node scripts/device-models.mjs`
      # fills it, digests locked by device-models.lock.json). Not committed; the experiment hides itself without them.
      - path: DeviceModels
        type: folder
        buildPhase: resources
        optional: true
    # The app's Info.plist is generated from these properties (`xcodegen generate` rewrites ScienceReader/Info.plist).
    # UIBackgroundModes/audio: paper podcasts keep playing with the screen locked or in another app
    # (docs/architecture/PAPER_PODCASTS.md); the player only plays local, verified files.
    info:
      path: ScienceReader/Info.plist
      properties:
        CFBundleDisplayName: Gradstep
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        NSCameraUsageDescription: Scan the code a new device shows, to add it to your account.
        NSMicrophoneUsageDescription: "Dictate a question on this device, or record a test session you explicitly start. Dictated questions remain drafts until you send them."
        NSSpeechRecognitionUsageDescription: "Turn your speech into an editable question using on-device recognition. Gradstep does not upload dictation audio."
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIAppFonts: [GoogleSans-Medium.ttf]
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes: [sciencereader]
        ScienceReaderAuthCallbackURL: sciencereader://auth/callback
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
        ScienceReaderSupabaseURL: $(SCIENCE_READER_SUPABASE_URL)
        ScienceReaderSupabaseAnonKey: $(SCIENCE_READER_SUPABASE_ANON_KEY)
        ScienceReaderEnvironment: $(SCIENCE_READER_ENVIRONMENT)
    dependencies:
      - package: ScienceReaderCore
      - package: LocalAI
      - package: SwiftMath
      # Share › Gradstep (docs/architecture/PDF_UPLOADS.md) is built but not embedded until the App Group
      # group.com.sciencereader.ios exists in the developer account (Apple's API can't create it). To restore:
      # re-add `- target: ScienceReaderShare` (platformFilter: iOS) here and the group in ScienceReader.entitlements.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sciencereader.ios
        CODE_SIGN_ENTITLEMENTS: Config/ScienceReader.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ScienceReader/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Mac: Mac Catalyst with the Mac idiom ("Optimize for Mac"), the same bundle ID and App
        # Store record as iOS (docs/architecture/MAC_APP.md). iOS settings are unchanged.
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "TARGETED_DEVICE_FAMILY[sdk=macosx*]": "2,6"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/ScienceReader-macOS.entitlements
        # The Mac shows the bundle name in the menu bar and Finder; the Swift module keeps its name.
        "PRODUCT_NAME[sdk=macosx*]": Gradstep
        PRODUCT_MODULE_NAME: ScienceReader
      configs:
        # FIXTURE_HOST: synthetic UI fixtures, only in Debug builds that run on a development host
        # (the Simulator or this Mac), never on a device or in a distributed build.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG INTERNAL"
          "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator*]": "DEBUG INTERNAL FIXTURE_HOST"
          "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=macosx*]": "DEBUG INTERNAL FIXTURE_HOST"
        Internal:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: INTERNAL
    scheme:
      testTargets: [ScienceReaderTests, ScienceReaderUITests]
      gatherCoverageData: true
  # Share extension: writes a shared PDF or link to the app group's inbox; the app adds it on launch.
  # No network or credentials (docs/architecture/PDF_UPLOADS.md "Share extension").
  ScienceReaderShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: [Info.plist]
      - path: ScienceReader/Services/ShareInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sciencereader.ios.share
        PRODUCT_NAME: GradstepShare
        CODE_SIGN_ENTITLEMENTS: Config/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SUPPORTS_MACCATALYST: NO
        SKIP_INSTALL: YES
  ScienceReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ScienceReaderUITests
        excludes: [OfflineResourcePerformanceTests.swift]
    dependencies:
      - target: ScienceReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sciencereader.ios.uitests
        SUPPORTS_MACCATALYST: YES
        # Match the app's iOS 17 / macOS 14 floor in XCTest destination preflight.
        "MACOSX_DEPLOYMENT_TARGET[sdk=macosx*]": "14.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ScienceReader
  ScienceReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ScienceReaderTests]
    dependencies:
      - target: ScienceReader
      - package: ScienceReaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sciencereader.ios.tests
        SUPPORTS_MACCATALYST: YES
        # Match the app's iOS 17 / macOS 14 floor in XCTest destination preflight.
        "MACOSX_DEPLOYMENT_TARGET[sdk=macosx*]": "14.0"
        GENERATE_INFOPLIST_FILE: YES
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Gradstep.app/Contents/MacOS/Gradstep"
  # This app runs the same reader/model with an isolated synthetic account.
  # Its resources and URL configuration are separate from all shipping builds.
  ScienceReaderResourceProbe:
    type: application
    platform: iOS
    sources:
      - path: ScienceReader
        excludes: [Info.plist, Resources/ReaderSamples, Resources/reader-sample.html, Resources/offline-resource]
      - path: ScienceReader/Resources/ReaderSamples
        type: folder
        buildPhase: resources
      - path: ScienceReader/Resources/offline-resource
        type: folder
        buildPhase: resources
    dependencies:
      - package: ScienceReaderCore
      - package: LocalAI
    info:
      path: Config/ResourceProbe-Info.plist
      properties:
        CFBundleDisplayName: Timestep Resource Probe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ScienceReaderEnvironment: offline-resource
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sciencereader.ios.resource-probe
        SUPPORTED_PLATFORMS: iphonesimulator
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: OFFLINE_RESOURCE_MEASUREMENTS FIXTURE_HOST
        SWIFT_OPTIMIZATION_LEVEL: -O
        SWIFT_COMPILATION_MODE: wholemodule
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  ScienceReaderResourceProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ScienceReaderUITests/OfflineResourcePerformanceTests.swift]
    dependencies:
      - target: ScienceReaderResourceProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sciencereader.ios.resource-probe.uitests
        SUPPORTED_PLATFORMS: iphonesimulator
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ScienceReaderResourceProbe
schemes:
  ScienceReader-ResourceProbe:
    build:
      targets:
        ScienceReaderResourceProbe: [run, test, profile]
        ScienceReaderResourceProbeUITests: [test]
    run:
      config: Release
      debugEnabled: false
      enableGPUFrameCaptureMode: disabled
      enableGPUValidationMode: false
      disableMainThreadChecker: true
      disableThreadPerformanceChecker: true
    test:
      config: Release
      debugEnabled: false
      gatherCoverageData: false
      testPlans:
        - path: Config/OfflineResource.xctestplan
          defaultPlan: true
      captureScreenshotsAutomatically: false
      enableGPUFrameCaptureMode: disabled
      enableGPUValidationMode: false
      disableMainThreadChecker: true
      targets:
        - name: ScienceReaderResourceProbeUITests
          parallelizable: false
          randomExecutionOrder: false
      environmentVariables:
        SCIENCE_READER_RESOURCE_TESTS: "1"
  ScienceReader-Internal:
    build:
      targets:
        ScienceReader: all
    run:
      config: Debug
    archive:
      config: Internal

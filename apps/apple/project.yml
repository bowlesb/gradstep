name: ScienceReader
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Internal: release
  Release: release
packages:
  ScienceReaderCore:
    path: ScienceReaderCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3BJ33TT599
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SCIENCE_READER_ENVIRONMENT: staging
configFiles:
  Debug: Config/.env.staging.xcconfig
  Internal: Config/.env.staging.xcconfig
targets:
  ScienceReader:
    type: application
    platform: iOS
    sources:
      - path: ScienceReader
        excludes: [Resources/ReaderSamples, Resources/reader-sample.html]
      - path: ScienceReader/Resources/ReaderSamples
        type: folder
        buildPhase: resources
    dependencies:
      - package: ScienceReaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sciencereader.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ScienceReader/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG INTERNAL"
        Internal:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: INTERNAL
    scheme:
      testTargets: [ScienceReaderTests, ScienceReaderUITests]
      gatherCoverageData: true
  ScienceReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ScienceReaderUITests]
    dependencies:
      - target: ScienceReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sciencereader.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ScienceReader
  ScienceReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ScienceReaderTests]
    dependencies:
      - target: ScienceReader
      - package: ScienceReaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sciencereader.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ScienceReader-Internal:
    build:
      targets:
        ScienceReader: all
    run:
      config: Debug
    archive:
      config: Internal

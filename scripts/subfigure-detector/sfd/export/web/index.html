<!doctype html><html><head><meta charset="utf-8"><title>ort-web parity</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.all.min.js"></script></head><body><pre id="o"></pre>
<script>
async function f32(url){const r=await fetch(url);return new Float32Array(await r.arrayBuffer());}
async function run(model, ep){
  const t0=performance.now();
  const s=await ort.InferenceSession.create('panel-detector-'+model+'.onnx',{executionProviders:[ep]});
  const load=performance.now()-t0; const res={model,ep,load_ms:load,runs:[]};
  for(let k=0;k<5;k++){
    const x=await f32('in'+k+'.bin'); const ref=await f32('ref-'+model+'-'+k+'.bin');
    const t=performance.now(); const o=await s.run({images:new ort.Tensor('float32',x,[1,3,640,640])}); const ms=performance.now()-t;
    const l=o.logits.data, b=o.boxes.data; let dp=0,db=0,dpc=0;
    for(let i=0;i<l.length;i++){const p=1/(1+Math.exp(-l[i])),q=1/(1+Math.exp(-ref[i]));dp=Math.max(dp,Math.abs(p-q)); if(q>0.25) dpc=Math.max(dpc,Math.abs(p-q));}
    for(let i=0;i<b.length;i++){db=Math.max(db,Math.abs(b[i]-ref[l.length+i]));}
    res.runs.push({k,ms,max_prob_diff:dp,max_prob_diff_credible:dpc,max_box_diff:db});
  }
  return res;
}
(async()=>{const out=[];ort.env.wasm.numThreads=4;
 for(const m of ['r18','r50m']) for(const ep of ['webgpu','wasm']){try{out.push(await run(m,ep));}catch(e){out.push({model:m,ep,error:String(e)});}}
 window.result=out;document.getElementById('o').textContent=JSON.stringify(out,null,1);})();
</script></body></html>

project_id = "science-reader"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "https://app.gradstep.ai"
additional_redirect_urls = ["sciencereader://auth/callback", "https://app.gradstep.ai/auth/callback"]
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "32MiB"

[functions.chat]
# Same handler-side Auth.getUser verification as support-assets. The function
# streams a metered answer; it stores no chat text.
verify_jwt = false

[functions.support-assets]
# Auth is verified against Auth.getUser inside the handler, including newer JWT
# signing keys. Anon/service tokens cannot become a reporter or operator.
verify_jwt = false


[functions.reader-artifact]
# Auth is verified against Auth.getUser inside the handler.
verify_jwt = false

[functions.reader-member]
# Auth.getUser plus an account-bound, one-use member grant in the handler.
verify_jwt = false

[functions.discover]
# Auth is verified against Auth.getUser inside the handler.
verify_jwt = false

[functions.feed-refresh]
# Called by pg_cron (pg_net) with the dedicated FEED_REFRESH_SECRET header, never a user token.
verify_jwt = false

[functions.account-delete]
# Auth is verified against Auth.getUser inside the handler.
verify_jwt = false

[functions.store-sync]
# Auth is verified against Auth.getUser inside the handler.
verify_jwt = false

[functions.app-store-notifications]
# Called by Apple; authenticated by verifying Apple's signature on the payload.
verify_jwt = false

[functions.store-verifier-health]
# Operator-only receipt-free probe. Exact service-role secret comparison inside
# the handler; ordinary user/anon JWTs cannot invoke Google or the private service.
verify_jwt = false

[functions.admin-accounts]
# Called from the admin site (browser preflights carry no token). The handler verifies the
# token with Auth.getUser and requires an owner with MFA (v1_admin_actor) before any change.
verify_jwt = false

[functions.admin-spending]
# Auth.getUser and caller-token v1_admin_actor require a real owner MFA session
# before the append-only evidence RPC. Browser preflights carry no token.
verify_jwt = false

<style>
#notes-snippets { color-scheme: light dark; }
#notes-snippets .ns-stage { padding: 28px 10px 20px; }
#notes-snippets .ns-preview-label { margin: 0 auto 12px; max-width: 414px; padding-right: 70px; font: 12px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; color: light-dark(#62626c, #adadb8); }
#notes-snippets .ns-phone {
  --ns-bg: light-dark(#fff, #141417); --ns-soft: light-dark(#f5f5f7, #1e1e24); --ns-line: light-dark(#e7e7ea, #34343c);
  --ns-ink: light-dark(#18181b, #e7e7ea); --ns-muted: light-dark(#656571, #aaaab5);
  --ns-accent: light-dark(#4f52cf, #a5a7ff); --ns-tint: light-dark(#eef0ff, #292944);
  --ns-onaccent: light-dark(#fff, #15152c); --ns-amber: light-dark(#b17417, #f5bd63);
  --ns-danger: light-dark(#ba273c, #ff909d); --ns-scrim: light-dark(#1c1c2030, #00000070);
  max-width: 414px; margin: auto; border: 1px solid var(--ns-line); border-radius: 26px; overflow: hidden;
  background: var(--ns-bg); color: var(--ns-ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  box-shadow: 0 16px 44px light-dark(#20202812, #00000030); position: relative;
}
#notes-snippets .ns-phone * { box-sizing: border-box; }
#notes-snippets [hidden] { display: none !important; }
#notes-snippets button, #notes-snippets input, #notes-snippets textarea, #notes-snippets select { font: inherit; color: inherit; }
#notes-snippets button { border: 0; background: transparent; min-height: 44px; padding: 9px 12px; border-radius: 12px; text-align: left; }
#notes-snippets button:disabled { opacity: .45; }
#notes-snippets button:hover:not(:disabled) { background: var(--ns-soft); }
#notes-snippets .ns-primary { background: var(--ns-accent); color: var(--ns-onaccent); text-align: center; font-weight: 600; }
#notes-snippets .ns-primary:hover:not(:disabled) { background: var(--ns-accent); filter: brightness(.95); }
#notes-snippets .ns-link { color: var(--ns-accent); display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
#notes-snippets .ns-danger { color: var(--ns-danger); }
#notes-snippets .ns-top { display: flex; align-items: center; gap: 4px; padding: 13px 12px 10px; position: relative; border-bottom: 1px solid var(--ns-line); }
#notes-snippets .ns-heading { min-width: 0; flex: 1; padding-left: 4px; }
#notes-snippets h2 { font-size: 19px; line-height: 1.25; font-weight: 600; letter-spacing: -.02em; margin: 0; overflow-wrap: anywhere; }
#notes-snippets h3 { font-size: 18px; line-height: 1.35; margin: 0 0 12px; font-weight: 600; }
#notes-snippets p { margin: 0 0 12px; }
#notes-snippets .ns-caption { font-size: 12px; line-height: 1.5; color: var(--ns-muted); }
#notes-snippets .ns-circle { width: 44px; height: 44px; padding: 0; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--ns-line); border-radius: 50%; color: var(--ns-accent); background: var(--ns-bg); }
#notes-snippets .ns-circle svg { width: 18px; height: 18px; }
#notes-snippets .ns-back { border: 0; }
#notes-snippets .ns-screen { min-height: 510px; }
#notes-snippets .ns-body { padding: 20px 16px; }
#notes-snippets .ns-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#notes-snippets .ns-between { justify-content: space-between; }
#notes-snippets .ns-grow { flex: 1; min-width: 0; }
#notes-snippets .ns-stack { display: grid; gap: 16px; }
#notes-snippets label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
#notes-snippets input:not([type=range]), #notes-snippets textarea, #notes-snippets select { width: 100%; min-width: 0; border: 1px solid var(--ns-line); border-radius: 12px; padding: 12px; background: var(--ns-bg); color: var(--ns-ink); font-size: 16px; font-weight: 400; }
#notes-snippets textarea { resize: vertical; min-height: 96px; }
#notes-snippets input::placeholder, #notes-snippets textarea::placeholder { color: var(--ns-muted); opacity: 1; }
#notes-snippets input[type=range] { accent-color: var(--ns-accent); width: 100%; min-height: 28px; }
#notes-snippets .ns-search { display: flex; align-items: center; gap: 8px; border-radius: 22px; background: var(--ns-soft); padding: 0 13px; margin-bottom: 14px; }
#notes-snippets .ns-search input { border: 0; background: transparent; padding-left: 0; }
#notes-snippets .ns-search svg { width: 17px; flex: none; color: var(--ns-muted); }
#notes-snippets .ns-notes-list { margin: 0; padding: 0; list-style: none; }
#notes-snippets .ns-note-row { padding: 15px 0; border-bottom: 1px solid var(--ns-line); display: flex; align-items: center; gap: 10px; }
#notes-snippets .ns-note-open { padding: 2px 4px; flex: 1; min-width: 0; }
#notes-snippets .ns-note-title { display: block; font-weight: 600; margin-bottom: 4px; overflow-wrap: anywhere; }
#notes-snippets .ns-note-preview { display: block; color: var(--ns-muted); font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 280px; }
#notes-snippets .ns-note-meta { margin-top: 8px; display: block; }
#notes-snippets .ns-note-mark { color: var(--ns-accent); background: var(--ns-tint); border-radius: 12px; width: 40px; height: 44px; display: grid; place-items: center; flex: none; }
#notes-snippets .ns-note-mark svg { width: 20px; height: 20px; }
#notes-snippets .ns-empty { padding: 48px 8px; text-align: center; }
#notes-snippets .ns-empty button { text-align: center; }
#notes-snippets .ns-day { font-size: 12px; font-weight: 600; color: var(--ns-muted); margin: 4px 0 18px; letter-spacing: .03em; }
#notes-snippets .ns-entry { position: relative; padding: 0 0 20px 16px; margin: 0 0 24px 3px; border-left: 1px solid var(--ns-line); }
#notes-snippets .ns-entry::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ns-amber); position: absolute; left: -4px; top: 7px; }
#notes-snippets .ns-entry-top { display: flex; align-items: center; gap: 4px; margin: -8px -5px 7px 0; }
#notes-snippets .ns-entry-top .ns-circle { border: 0; margin-left: auto; }
#notes-snippets .ns-entry blockquote { margin: 0 0 13px; padding: 12px 14px; background: var(--ns-soft); border-radius: 10px; font: 16px/1.6 Georgia, serif; }
#notes-snippets .ns-comment { font-size: 15px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
#notes-snippets .ns-source { display: block; width: 100%; font-size: 12px; line-height: 1.5; color: var(--ns-muted); padding: 9px 0; overflow-wrap: anywhere; }
#notes-snippets .ns-source strong { color: var(--ns-accent); font-weight: 500; }
#notes-snippets .ns-image { width: 100%; padding: 0; overflow: hidden; border: 1px solid var(--ns-line); border-radius: 10px; margin-bottom: 12px; background: var(--ns-bg); display: block; }
#notes-snippets .ns-crop-svg { display: block; width: 100%; max-height: 220px; color: var(--ns-ink); }
#notes-snippets .ns-image:hover { background: var(--ns-bg); }
#notes-snippets .ns-paper { padding: 15px 16px 0; }
#notes-snippets .ns-paper-surface { position: relative; overflow: hidden; border-radius: 3px; user-select: text; }
#notes-snippets .ns-paper-surface.ns-capturing { touch-action: none; user-select: none; cursor: crosshair; }
#notes-snippets .ns-paper-svg { display: block; width: 100%; height: auto; background: var(--ns-bg); }
#notes-snippets .ns-paper-ink { fill: var(--ns-ink); }
#notes-snippets .ns-paper-muted { fill: var(--ns-muted); }
#notes-snippets .ns-plot-grid { stroke: var(--ns-line); }
#notes-snippets .ns-plot-a { stroke: var(--ns-accent); }
#notes-snippets .ns-plot-b { stroke: var(--ns-muted); }
#notes-snippets .ns-crop-box { position: absolute; border: 2px solid var(--ns-accent); box-shadow: 0 0 0 600px var(--ns-scrim); touch-action: none; cursor: move; }
#notes-snippets .ns-handle { position: absolute; width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; touch-action: none; display: grid; place-items: center; }
#notes-snippets .ns-handle::after { content: ''; position: absolute; width: 10px; height: 10px; border-radius: 3px; border: 2px solid var(--ns-accent); background: var(--ns-bg); }
#notes-snippets .ns-handle:hover { background: transparent !important; }
#notes-snippets .ns-handle[data-corner=nw] { top: 0; left: 0; cursor: nwse-resize; }
#notes-snippets .ns-handle[data-corner=ne] { top: 0; right: 0; cursor: nesw-resize; }
#notes-snippets .ns-handle[data-corner=sw] { bottom: 0; left: 0; cursor: nesw-resize; }
#notes-snippets .ns-handle[data-corner=se] { bottom: 0; right: 0; cursor: nwse-resize; }
#notes-snippets .ns-handle[data-corner=nw]::after { top: 0; left: 0; }
#notes-snippets .ns-handle[data-corner=ne]::after { top: 0; right: 0; }
#notes-snippets .ns-handle[data-corner=sw]::after { bottom: 0; left: 0; }
#notes-snippets .ns-handle[data-corner=se]::after { bottom: 0; right: 0; }
#notes-snippets .ns-capture-controls { padding: 10px 16px 16px; display: grid; gap: 10px; }
#notes-snippets .ns-capture-controls .ns-primary { width: 100%; }
#notes-snippets .ns-edges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
#notes-snippets details { font-size: 13px; color: var(--ns-muted); }
#notes-snippets summary { min-height: 44px; padding: 10px 0; }
#notes-snippets .ns-toolbar { margin: 4px 16px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#notes-snippets .ns-toolbar .ns-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 6px 8px; }
#notes-snippets .ns-nav { display: flex; border: 1px solid var(--ns-line); border-radius: 30px; margin: 4px 12px 13px; padding: 4px; background: var(--ns-bg); box-shadow: 0 4px 18px light-dark(#10101809, #00000020); }
#notes-snippets .ns-tab { flex: 1; min-width: 0; padding: 7px 1px; border-radius: 24px; text-align: center; display: grid; justify-items: center; gap: 4px; font-size: 11px; color: var(--ns-muted); }
#notes-snippets .ns-tab svg { width: 19px; height: 19px; }
#notes-snippets .ns-tab[aria-current=page] { background: var(--ns-tint); color: var(--ns-accent); font-weight: 600; }
#notes-snippets .ns-popover { position: absolute; top: 66px; right: 12px; left: 60px; z-index: 10; padding: 6px; border: 1px solid var(--ns-line); border-radius: 17px; background: var(--ns-bg); box-shadow: 0 10px 36px light-dark(#11112222, #00000070); }
#notes-snippets .ns-popover button { width: 100%; display: flex; align-items: center; gap: 12px; font-size: 14px; }
#notes-snippets .ns-popover svg { width: 17px; height: 17px; color: var(--ns-accent); }
#notes-snippets .ns-popover hr { border: 0; border-top: 1px solid var(--ns-line); margin: 4px 6px; }
#notes-snippets .ns-notice { margin: 10px 16px; padding: 10px 12px; background: var(--ns-tint); border-radius: 12px; font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#notes-snippets .ns-notice button { padding: 4px 6px; }
#notes-snippets .ns-sync { margin: 0 16px 12px; padding: 10px 12px; background: var(--ns-soft); border-radius: 12px; font-size: 12px; }
#notes-snippets .ns-fact { padding: 14px 0; border-bottom: 1px solid var(--ns-line); display: flex; gap: 12px; justify-content: space-between; }
#notes-snippets .ns-fact span:last-child { color: var(--ns-muted); text-align: right; }
#notes-snippets .ns-form-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
#notes-snippets .ns-error { color: var(--ns-danger); font-size: 13px; }
#notes-snippets .ns-selection { fill: var(--ns-tint); }
#notes-snippets .ns-library-paper { padding: 14px 0; border-bottom: 1px solid var(--ns-line); width: 100%; }
#notes-snippets .ns-library-paper strong { display: block; margin-bottom: 7px; }
#notes-snippets .ns-sr { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
@media (max-width: 380px) {
  #notes-snippets .ns-stage { padding: 26px 0 12px; }
  #notes-snippets .ns-paper { padding: 12px 12px 0; }
  #notes-snippets .ns-top { padding-inline: 8px; }
  #notes-snippets .ns-body { padding: 16px 12px; }
  #notes-snippets .ns-note-preview { max-width: 205px; }
}
</style>
<div id="notes-snippets">
  <div class="ns-stage viz-dotted-background">
    <div class="ns-preview-label">Interactive design · sample data<br>Edits are session-only; sync is simulated.</div>
    <div class="ns-phone" aria-label="Gradstep Notes design">
      <div id="ns-content"></div>
      <div id="ns-announcement" class="ns-sr" aria-live="polite"></div>
    </div>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('notes-snippets');
  const content = root.querySelector('#ns-content');
  const announce = root.querySelector('#ns-announcement');
  const settings = { sync: 'Synced', sourceAvailable: true, previewSize: 'Comfortable' };
  const sampleQuote = 'The strongest gains appear early. Later updates improve consistency more than average performance.';
  const captured = '2026-10-20T17:42:00Z';
  const notes = [
    { id: 'alignment', title: 'Alignment ideas', updated: captured, entries: [
      { id: 'first', type: 'region', rect: { x: 0, y: 199, w: 360, h: 256 }, comment: 'The early improvement is the interesting part. Compare this with the smaller-model experiment.', time: captured },
      { id: 'second', type: 'quote', quote: sampleQuote, comment: 'Is consistency the better metric for our evaluation?', time: '2026-10-20T17:49:00Z' }
    ] },
    { id: 'friday', title: 'Reading for Friday', updated: '2026-10-19T21:15:00Z', entries: [
      { id: 'third', type: 'text', comment: 'Compare the training objectives. Bring one clear example of a failure case.', time: '2026-10-19T21:15:00Z' }
    ] }
  ];
  let screen = 'paper', activeNote = 'alignment', menu = null, mode = 'read', rect = null, quoteSelected = false;
  let form = null, search = '', notice = null, lastDestination = 'alignment', returnScreen = 'paper', zoom = 1;
  let drawing = null, hold = null, heldPoint = null, entryTarget = null;
  let lastHostState = JSON.stringify(window.openai?.widgetState ?? null);
  const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const button = (action, label, cls = 'ns-link', extra = '') => `<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`;
  const circle = (action, name, label, extra = '') => button(action, icon(name), 'ns-circle', `aria-label="${escape(label)}" ${extra}`);
  const currentNote = () => notes.find(n => n.id === activeNote);
  const id = () => globalThis.crypto?.randomUUID?.() || `demo-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const dateLabel = value => new Date(value).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const timeLabel = value => new Date(value).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  const notify = value => { announce.textContent = value; };
  function remember() {
    const state = { modelContent: { design: 'Gradstep Notes', screen, syncPreview: settings.sync, sourceAvailable: settings.sourceAvailable }, privateContent: { screen, activeNote, sync: settings.sync, sourceAvailable: settings.sourceAvailable } };
    lastHostState = JSON.stringify(state);
    if (window.openai?.setWidgetState) window.openai.setWidgetState(state).catch(() => {});
  }
  function restore(saved) {
    const p = saved?.privateContent;
    if (!p) return;
    if (['paper','notes','feed','library','chat'].includes(p.screen)) screen = p.screen;
    if (notes.some(n => n.id === p.activeNote)) activeNote = p.activeNote;
    if (['Synced','Offline','Sync paused'].includes(p.sync)) settings.sync = p.sync;
    if (typeof p.sourceAvailable === 'boolean') settings.sourceAvailable = p.sourceAvailable;
  }
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', event => {
    const next=event.detail?.globals?.widgetState;
    if(next===undefined || JSON.stringify(next)===lastHostState)return;
    lastHostState=JSON.stringify(next);restore(next);render();
  });

  function paperMarkup(selected = false) {
    return `<rect x="0" y="0" width="360" height="455" fill="var(--ns-bg)"/>
      <text x="8" y="32" class="ns-paper-ink" font-family="Georgia,serif" font-size="25">Learning from feedback</text>
      <text x="8" y="58" class="ns-paper-muted" font-size="16">Example paper · revision 1</text>
      <text x="8" y="100" class="ns-paper-ink" font-family="Georgia,serif" font-size="21">3. Comparing the results</text>
      ${selected ? '<rect x="6" y="114" width="348" height="79" rx="3" class="ns-selection"/>' : ''}
      <text class="ns-paper-ink" font-family="Georgia,serif" font-size="17">
        <tspan x="8" y="135">The strongest gains appear early. Later</tspan>
        <tspan x="8" y="159">updates improve consistency more than</tspan>
        <tspan x="8" y="183">average performance.</tspan>
      </text>
      <g fill="none" stroke-width="1" class="ns-plot-grid">
        <path d="M48 239H326 M48 284H326 M48 329H326 M48 374H326"/>
        <path d="M48 232V374H330" stroke="var(--ns-muted)"/>
      </g>
      <g class="ns-paper-muted" font-size="16">
        <text x="8" y="220">Score</text><text x="10" y="246">90</text><text x="10" y="291">70</text><text x="10" y="336">50</text>
        <text x="43" y="396">0</text><text x="174" y="396">5</text><text x="307" y="396">10</text>
        <text x="105" y="422">Training steps (k)</text>
      </g>
      <path d="M49 351 C80 320 99 274 132 257 S214 239 325 237" fill="none" stroke-width="3" class="ns-plot-a"/>
      <path d="M49 352 C90 332 107 311 144 297 S243 278 325 276" fill="none" stroke-width="2.5" stroke-dasharray="6 5" class="ns-plot-b"/>
      <text x="195" y="229" fill="var(--ns-accent)" font-size="16">Feedback</text>
      <text x="248" y="300" class="ns-paper-muted" font-size="16">Baseline</text>
      <text x="8" y="451" class="ns-paper-muted" font-family="Georgia,serif" font-size="16">Figure 2. Improvement over training.</text>`;
  }
  function cropMarkup(r, cls = 'ns-crop-svg', zoomFactor = 1) {
    const cut = r || {x: 22, y: 205, w: 318, h: 194};
    const w = cut.w / zoomFactor, h = cut.h / zoomFactor;
    return `<svg class="${cls}" viewBox="${cut.x+(cut.w-w)/2} ${cut.y+(cut.h-h)/2} ${w} ${h}" role="img" aria-label="Captured region from the example paper" xmlns="http://www.w3.org/2000/svg">${paperMarkup()}</svg>`;
  }
  function syncStatus() {
    if (settings.sync === 'Synced') return '';
    return `<div class="ns-sync" role="status">${settings.sync === 'Offline' ? 'Saved on this device · Waiting to sync' : 'Your changes are saved here. Sync is paused.'}${settings.sync === 'Sync paused' ? button('retry-sync','Retry') : ''}</div>`;
  }
  function header(title, subtitle, {back = false, add = false, more = true} = {}) {
    return `<header class="ns-top">${back ? circle('back','chevron-left','Back to Notes') : ''}<div class="ns-heading"><h2>${escape(title)}</h2>${subtitle ? `<div class="ns-caption">${escape(subtitle)}</div>` : ''}</div>${add ? circle('add','plus',screen === 'note' ? 'Add text to note' : 'New note') : ''}${more ? circle('menu','ellipsis',`${title} options`) : ''}</header>`;
  }
  function nav() {
    const active = ['note'].includes(screen) ? 'notes' : screen;
    return `<nav class="ns-nav" aria-label="Main destinations">${[['feed','radio','Feed'],['library','library','Library'],['paper','file-text','Paper'],['chat','messages-square','Chat'],['notes','notebook-pen','Notes']].map(([key, ico, label]) =>
      button('tab', `${icon(ico)}<span>${label}</span>`, 'ns-tab', `data-tab="${key}" ${active === key ? 'aria-current="page"' : ''}`)).join('')}</nav>`;
  }
  function paper() {
    const capture = mode === 'capture';
    return `${capture ? `<header class="ns-top">${button('cancel-capture','Cancel')}<div class="ns-heading"><h2>Draw snippet</h2><div class="ns-caption">Drag around anything on the page</div></div></header>` : header('Paper','Learning from feedback')}
      <div class="ns-screen"><div class="ns-paper"><div class="ns-paper-surface ${capture ? 'ns-capturing' : ''}" id="ns-paper-surface">
        <svg class="ns-paper-svg" viewBox="0 0 360 455" role="img" aria-label="Example scientific paper with a comparison chart. Hold to select text or draw a snippet." xmlns="http://www.w3.org/2000/svg">${paperMarkup(quoteSelected)}</svg>
        ${capture ? `<div class="ns-crop-box" id="ns-crop-box" hidden>${['nw','ne','sw','se'].map(c => button('handle','', 'ns-handle', `data-corner="${c}" aria-label="Adjust ${ {nw:'top left',ne:'top right',sw:'bottom left',se:'bottom right'}[c]} corner with arrow keys"`)).join('')}</div>` : ''}
      </div></div>
      ${capture ? `<div class="ns-capture-controls"><div class="ns-row ns-between"><span id="ns-crop-size" class="ns-caption" aria-live="polite">Draw a box, or select the figure.</span>${button('whole-figure','Select figure')}</div>
        <details><summary>Adjust edges without dragging</summary><div class="ns-edges">${[['left','Left edge',360],['right','Right edge',360],['top','Top edge',455],['bottom','Bottom edge',455]].map(([key,label,max]) => `<label>${label}<input type="range" data-edge="${key}" min="0" max="${max}" value="0" aria-label="${label}"></label>`).join('')}</div></details>
        ${button('use-crop','Use snippet','ns-primary','id="ns-use-crop" disabled')}</div>` : `<div class="ns-toolbar">${button('contents',`${icon('list')} Contents`)}${button(quoteSelected ? 'save-selection' : 'capture',quoteSelected ? 'Add selection to note' : `${icon('scan')} Draw snippet`)}</div>`}
      </div>`;
  }
  function notesList() {
    return `${header('Notes',`${notes.length} notes · ${settings.sync}`,{add:true})}${syncStatus()}<div class="ns-screen ns-body"><label class="ns-search">${icon('search')}<input id="ns-search" type="search" aria-label="Search notes" placeholder="Search notes" value="${escape(search)}"></label><ul class="ns-notes-list" id="ns-notes-list">${notesRows()}</ul></div>`;
  }
  function notesRows() {
    const q = search.trim().toLowerCase();
    const found = [...notes].sort((a,b) => b.updated.localeCompare(a.updated)).filter(n => [n.title,...n.entries.map(e => `${e.comment} ${e.quote || ''}`)].join(' ').toLowerCase().includes(q));

      e.preventDefault();const p=point(e),corner=e.target.closest('[data-corner]')?.dataset.corner;
      drawing={start:p,base:rect?{...rect}:null,kind:corner||(e.target.closest('#ns-crop-box')?'move':'new')};
      if(drawing.kind==='new')rect={x:p.x,y:p.y,w:0,h:0};area.setPointerCapture(e.pointerId);updateRect();
    });
    area.addEventListener('pointermove',e=>{
      if(hold&&heldPoint&&Math.hypot(e.clientX-heldPoint.x,e.clientY-heldPoint.y)>8){clearTimeout(hold);hold=null;}
      if(!drawing)return;const p=point(e),dx=p.x-drawing.start.x,dy=p.y-drawing.start.y;
      if(drawing.kind==='new')rect={x:Math.min(p.x,drawing.start.x),y:Math.min(p.y,drawing.start.y),w:Math.abs(dx),h:Math.abs(dy)};
      else if(drawing.kind==='move')rect={...drawing.base,x:clamp(drawing.base.x+dx,0,360-drawing.base.w),y:clamp(drawing.base.y+dy,0,455-drawing.base.h)};
      else moveCorner(drawing.kind,drawing.base,dx,dy);updateRect();
    });
    const finish=e=>{if(hold){clearTimeout(hold);hold=null;}if(drawing){drawing=null;updateRect();notify('Region selected. Adjust it or use the snippet.');}if(area.hasPointerCapture?.(e.pointerId))area.releasePointerCapture(e.pointerId);};
    area.addEventListener('pointerup',finish);area.addEventListener('pointercancel',finish);
  }
  render();
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root.querySelector('.ns-phone'),onChange:()=>{render();remember();}});
    tweak.addSelect(settings,'sync',{label:'Sync state (simulated)',options:['Synced','Offline','Sync paused']});
    tweak.addToggle(settings,'sourceAvailable',{label:'Paper is on this device'});
    tweak.addSelect(settings,'previewSize',{label:'Snippet preview height',options:['Comfortable','Compact']});
  }
})();
</script>
